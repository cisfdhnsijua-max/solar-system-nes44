<style>

<body>
<div class="box">

<div id="joke">

यह सिर्फ एक prank है।<br>

</div>
<button onclick="document.getElementById('scan').style.display='none';document.getElementById('joke').style.display='block';this.style.display='none'">STOP HACK 😱</button>

setTimeout(()=>{document.getElementById('scan').innerHTML += '<br>⚠️ Bank Balance: ₹0 (FAKE)';},1200);
